<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THMA CPE Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #111827; }
        .card { transition: all 0.2s ease-in-out; }
        .details-section { display: none; }
        .details-section.open { display: block; animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="pb-20">
    <div id="app" class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Header -->
        <header class="mb-6 sticky top-0 bg-[#f3f4f6] pt-4 pb-4 z-10 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2 mb-3">
                <i data-lucide="users" class="text-blue-600"></i>
                THMA CPE Intel
            </h1>
            
            <div class="relative mb-3">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="h-5 w-5 text-gray-400"></i>
                </div>
                <input type="text" id="searchInput" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-lg shadow-sm" placeholder="Search accounts, names, titles...">
            </div>

            <div class="flex gap-2 mb-2">
                <select id="priorityFilter" class="block w-full py-2 px-3 border border-gray-300 bg-white rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    <option value="all">All Priorities</option>
                    <option value="High">🔥 High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>
                <select id="intelFilter" class="block w-full py-2 px-3 border border-gray-300 bg-white rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    <option value="all">All Intel</option>
                    <option value="notes">Has Playbook Notes</option>
                    <option value="opps">Open Opps</option>
                </select>
            </div>
            
            <div class="flex justify-between items-center mt-2">
                <div id="resultCount" class="text-sm text-gray-500 font-medium"></div>
                <button onclick="toggleAllCards()" id="toggleAllBtn" class="text-sm text-blue-600 font-medium">Expand All</button>
            </div>
        </header>

        <!-- List -->
        <main id="directoryList" class="space-y-4">
            <!-- Loading state -->
            <div class="text-center py-10">
                <i data-lucide="loader-2" class="h-8 w-8 animate-spin text-blue-600 mx-auto"></i>
                <p class="mt-2 text-gray-500">Loading intel...</p>
            </div>
        </main>
    </div>

    <script>
        let attendees = [];
        let filteredAttendees = [];
        let allExpanded = false;

        lucide.createIcons();

        async function loadData() {
            try {
                const response = await fetch('./data.json?v=' + new Date().getTime());
                attendees = await response.json();
                
                attendees.sort((a, b) => {
                    const sysA = (a.healthSystem || '').toLowerCase();
                    const sysB = (b.healthSystem || '').toLowerCase();
                    if (sysA < sysB) return -1;
                    if (sysA > sysB) return 1;
                    return (a.name || '').localeCompare(b.name || '');
                });

                filteredAttendees = [...attendees];
                renderList();
            } catch (error) {
                document.getElementById('directoryList').innerHTML = `<div class="text-center text-red-500 py-10">Error loading data.</div>`;
            }
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const priorityVal = document.getElementById('priorityFilter').value;
            const intelVal = document.getElementById('intelFilter').value;
            
            filteredAttendees = attendees.filter(p => {
                const searchStr = `${p.name} ${p.healthSystem} ${p.title}`.toLowerCase();
                const matchesSearch = searchStr.includes(query);
                
                let matchesPriority = true;
                if (priorityVal !== 'all') {
                    matchesPriority = (p.priorityLevel || '').toLowerCase().includes(priorityVal.toLowerCase());
                }

                let matchesIntel = true;
                if (intelVal === 'notes') {
                    matchesIntel = !!(p.davidNotes || p.jasonNotes || p.avpNotes);
                } else if (intelVal === 'opps') {
                    matchesIntel = !!p.openOpps;
                }

                return matchesSearch && matchesPriority && matchesIntel;
            });

            renderList();
        }

        function toggleCard(id) {
            const el = document.getElementById('details-' + id);
            const icon = document.getElementById('icon-' + id);
            if (el.classList.contains('open')) {
                el.classList.remove('open');
                icon.innerHTML = '<polyline points="6 9 12 15 18 9"></polyline>';
            } else {
                el.classList.add('open');
                icon.innerHTML = '<polyline points="18 15 12 9 6 15"></polyline>';
            }
        }

        function toggleAllCards() {
            allExpanded = !allExpanded;
            document.getElementById('toggleAllBtn').textContent = allExpanded ? 'Collapse All' : 'Expand All';
            document.querySelectorAll('.details-section').forEach(el => {
                const id = el.id.replace('details-', '');
                const icon = document.getElementById('icon-' + id);
                if (allExpanded) {
                    el.classList.add('open');
                    icon.innerHTML = '<polyline points="18 15 12 9 6 15"></polyline>';
                } else {
                    el.classList.remove('open');
                    icon.innerHTML = '<polyline points="6 9 12 15 18 9"></polyline>';
                }
            });
        }

        function saveNote(id, val) {
            localStorage.setItem('teddy_note_' + id, val);
        }

        function getPriorityBadge(level) {
            if (!level) return '';
            const lower = level.toLowerCase();
            if (lower.includes('high')) return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800">High</span>`;
            if (lower.includes('medium')) return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-100 text-yellow-800">Med</span>`;
            if (lower.includes('low')) return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">Low</span>`;
            return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-800">${level}</span>`;
        }

        function renderList() {
            const container = document.getElementById('directoryList');
            document.getElementById('resultCount').textContent = `${filteredAttendees.length} results`;
            
            if (filteredAttendees.length === 0) {
                container.innerHTML = `<div class="text-center py-12"><p class="text-gray-500 font-medium">No attendees found</p></div>`;
                return;
            }

            container.innerHTML = filteredAttendees.map(p => {
                const hasNotes = p.davidNotes || p.jasonNotes || p.avpNotes;
                const hasDeepResearch = p.publications || p.personalInterests || p.leadIn || p.imageUrl;
                const localNote = localStorage.getItem('teddy_note_' + p.id) || '';
                
                let imageHtml = '';
                if (p.imageUrl) {
                    imageHtml = `<img src="${p.imageUrl}" alt="${p.name}" class="w-12 h-12 rounded-full object-cover shrink-0 border border-gray-200" onerror="this.style.display='none'">`;
                } else {
                    imageHtml = `<div class="w-12 h-12 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center shrink-0 border border-gray-200"><i data-lucide="user" class="w-6 h-6"></i></div>`;
                }

                let badgesHtml = getPriorityBadge(p.priorityLevel);
                if (p.openOpps) badgesHtml += `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-100 text-emerald-800">${p.openOpps} Opps</span>`;

                return `
                    <div class="card bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden mb-3">
                        <!-- Card Header (Always visible) -->
                        <div class="p-4 flex items-center justify-between cursor-pointer" onclick="toggleCard('${p.id}')">
                            <div class="flex gap-4 items-center">
                                ${imageHtml}
                                <div>
                                    <h2 class="text-base font-bold text-gray-900 leading-tight">${p.name || 'Unknown'}</h2>
                                    <p class="text-sm font-medium text-blue-600">${p.healthSystem || 'Unknown System'}</p>
                                    <div class="flex flex-wrap gap-1 mt-1">
                                        ${badgesHtml}
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <a href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent((p.name || '') + ' ' + (p.healthSystem || ''))}" target="_blank" onclick="event.stopPropagation()" class="rounded-md p-1 hover:bg-gray-100" title="Search on LinkedIn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                                </a>
                                <svg id="icon-${p.id}" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </div>
                        </div>
                        
                        <!-- Collapsible Details -->
                        <div id="details-${p.id}" class="details-section ${allExpanded ? 'open' : ''} border-t border-gray-100 bg-gray-50/50">
                            <div class="p-4 space-y-4">
                                <div class="text-sm text-gray-600 mb-2 font-medium">${p.title || 'No Title Listed'}</div>
                                
                                ${p.leadIn ? `
                                <div class="bg-amber-50 rounded-lg p-3 border-l-2 border-amber-400">
                                    <span class="text-xs font-bold uppercase tracking-wider text-amber-800 mb-1 block">Icebreaker Anchor</span>
                                    <p class="text-sm text-amber-900 font-medium">${p.leadIn}</p>
                                </div>` : ''}

                                ${p.davidNotes || p.jasonNotes || p.avpNotes ? `
                                <div class="bg-white rounded-lg p-3 border border-gray-200">
                                    ${p.davidNotes ? `<div class="mb-2"><span class="text-xs font-bold uppercase text-blue-600">David's Notes:</span> <span class="text-sm text-gray-800">${p.davidNotes}</span></div>` : ''}
                                    ${p.jasonNotes ? `<div class="mb-2"><span class="text-xs font-bold uppercase text-indigo-600">Jason's Notes:</span> <span class="text-sm text-gray-800">${p.jasonNotes}</span></div>` : ''}
                                    ${p.avpNotes ? `<div><span class="text-xs font-bold uppercase text-emerald-600">AVP Background:</span> <span class="text-sm text-gray-800">${p.avpNotes}</span></div>` : ''}
                                </div>` : ''}

                                ${p.publications ? `
                                <div class="bg-white rounded-lg p-3 border border-gray-200">
                                    <span class="text-xs font-bold uppercase text-purple-600 mb-1 block">Recent News / Pubs</span>
                                    <p class="text-sm text-gray-800">${p.publications}</p>
                                </div>` : ''}

                                ${p.personalInterests ? `
                                <div class="bg-white rounded-lg p-3 border border-gray-200">
                                    <span class="text-xs font-bold uppercase text-rose-600 mb-1 block">Personal / Interests</span>
                                    <p class="text-sm text-gray-800">${p.personalInterests}</p>
                                </div>` : ''}

                                <!-- Personal Free Text Notes -->
                                <div class="mt-4">
                                    <label class="text-xs font-bold uppercase text-gray-500 mb-1 block">My Live Notes</label>
                                    <textarea 
                                        class="w-full text-sm p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" 
                                        rows="2" 
                                        placeholder="Jot down things to remember from your conversation..."
                                        oninput="saveNote('${p.id}', this.value)"
                                    >${localNote}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('priorityFilter').addEventListener('change', filterData);
        document.getElementById('intelFilter').addEventListener('change', filterData);

        loadData();
    </script>
</body>
</html>
